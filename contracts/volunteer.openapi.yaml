openapi: 3.1.0
info:
  title: CheckUp 봉사 관리 API
  version: 1.0.0
  description: |
    사감·기숙사 자치위원(관리자)의 봉사 관리 명단, 봉사 횟수 조정, 당일 봉사자 지정·완료 API다.
    제공자는 CheckUp-server(CheckUp-server#76), 소비자는 관리자 웹 봉사 관리 화면이다.
    봉사는 기숙사 벌칙이고 봉사 횟수는 앞으로 해야 할 횟수다. 정책은 REQ-COM-001·002·006, DEC-020·021을 따른다.

    - 인증: `SESSION` 쿠키(DEC-016). 웹은 `credentials: "include"`로 호출한다.
    - 모든 API는 관리자 전용이다. 관리자 여부는 요청마다 DB의 회원 역할로 판정한다.
    - 경로의 `studentId`는 DataGSM 학생 id다.
    - 조정·지정·취소·완료 API는 바뀐 학생의 명단 항목을 돌려준다. 웹은 그 행만 바꾸면 된다.
    - 당일은 운영일(08:00 KST 경계, DEC-006) 기준이다.
    - 시각은 모두 ISO-8601 UTC 문자열이다.
servers:
  - url: /
    description: 웹과 같은 출처. 웹은 `/api/*`를 Spring 서버로 프록시한다.
security:
  - sessionCookie: []
tags:
  - name: 봉사 관리 명단
    description: 전체 학생의 봉사 횟수 명단(REQ-COM-001)
  - name: 봉사 횟수 조정
    description: 봉사 `+1`(잘못했을 때) / `−1`(사감 감면)(REQ-COM-002)
  - name: 당일 봉사자
    description: 오늘 봉사자 지정·취소·완료(REQ-COM-006)
paths:
  /api/v1/volunteer:
    get:
      tags: [봉사 관리 명단]
      summary: 봉사 관리 명단 조회
      description: |
        DataGSM 학생 id가 있는 저장 학생 전체를 돌려준다. 명단 추가·제외 단계는 없다.
        정렬은 검색 일치 순위 → 호실 → 이름 → 학번이며 호실이 없는 학생은 맨 뒤다. 웹은 같은 호실끼리 묶어 보여준다.
      operationId: getVolunteers
      parameters:
        - name: q
          in: query
          required: false
          description: |
            검색어. 숫자면 호실 번호나 학번이 정확히 같은 학생만(`412` → 412호).
            그 밖에는 이름으로 찾고 포함 → 초성 일치(`ㄱㅁㅇ`) → 자음·모음 오타 1개(`강민오` → 강민우) 순으로 앞에 둔다.
          schema:
            type: string
        - name: floor
          in: query
          required: false
          description: 층(호실 맨 앞자리, 412호 → 4). 값이 있으면 호실 미배정 학생은 빠진다.
          schema:
            type: integer
        - name: minCount
          in: query
          required: false
          description: 봉사 횟수가 이 값 이상인 학생만. 당일 봉사자 후보는 `minCount=1`로 찾는다.
          schema:
            type: integer
        - name: onDuty
          in: query
          required: false
          description: "`true`면 오늘 지정된(완료 포함) 학생만. 자치위원 완료 확인용"
          schema:
            type: boolean
      responses:
        "200":
          description: 명단
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolunteerResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
  /api/v1/volunteer/{studentId}/count/increase:
    patch:
      tags: [봉사 횟수 조정]
      summary: 봉사 횟수 +1
      description: 학생이 잘못했을 때 봉사를 1회 늘린다. 확인 단계 없이 즉시 반영하고 조정 날짜를 남긴다. 알림은 만들지 않는다.
      operationId: increaseVolunteerCount
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/UpdatedItem"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/StudentNotFound"
        "409":
          $ref: "#/components/responses/KeyReused"
  /api/v1/volunteer/{studentId}/count/decrease:
    patch:
      tags: [봉사 횟수 조정]
      summary: 봉사 횟수 −1(감면)
      description: |
        사감이 특별한 사정으로 봉사를 1회 감면한다. 봉사를 마친 것은 당일 봉사 완료(`/duty/complete`)로 줄인다.
        `volunteer_count > 0` 조건 한 쿼리로 줄여 0 미만이 되지 않는다.
      operationId: decreaseVolunteerCount
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/UpdatedItem"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/StudentNotFound"
        "409":
          description: 횟수가 0이라 줄일 수 없거나(`VOLUNTEER_COUNT_ZERO`), 재시도 키를 다른 요청에 썼다(`IDEMPOTENCY_KEY_REUSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: VOLUNTEER_COUNT_ZERO
                message: 봉사 횟수가 0이라 차감할 수 없습니다.
  /api/v1/volunteer/{studentId}/adjustments:
    get:
      tags: [봉사 횟수 조정]
      summary: 봉사 횟수 조정 이력
      description: |
        관리자 전용. 학생 한 명의 조정 이력을 최신순으로 돌려준다(DEC-028). 같은 시각이면 나중에 저장한 기록이 앞이다.
        당일 봉사 완료의 차감(-1)도 포함한다. `limit`은 1~100(기본 50)이고 벗어나면 400 `INVALID_REQUEST`다.
      operationId: getVolunteerAdjustments
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 조정 이력. 없으면 빈 배열
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolunteerAdjustmentResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/StudentNotFound"
  /api/v1/volunteer/{studentId}/count:
    patch:
      tags: [봉사 횟수 조정]
      summary: 봉사 횟수 여러 회 조정(사유)
      description: |
        관리자가 봉사 횟수를 한 번에 1~99회 늘리거나 줄이고 사유(선택)를 남긴다(DEC-027).
        차감은 남은 횟수까지만 하고, 남은 횟수가 0이면 409 `VOLUNTEER_COUNT_ZERO`다.
        같은 `Idempotency-Key`의 재시도는 한 번만 반영하며, 그 키를 다른 학생·다른 `delta`에 쓰면 409 `IDEMPOTENCY_KEY_REUSED`다.
        알림은 만들지 않는다. 사유는 로그에 남기지 않는다.
      operationId: adjustVolunteerCount
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerAdjustRequest"
      responses:
        "200":
          $ref: "#/components/responses/UpdatedItem"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/StudentNotFound"
        "409":
          description: 남은 횟수가 0이라 줄일 수 없거나(`VOLUNTEER_COUNT_ZERO`), 재시도 키를 다른 요청에 썼다(`IDEMPOTENCY_KEY_REUSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: VOLUNTEER_COUNT_ZERO
                message: 봉사 횟수가 0이라 차감할 수 없습니다.
  /api/v1/volunteer/{studentId}/duty:
    post:
      tags: [당일 봉사자]
      summary: 당일 봉사자 지정
      description: |
        학생을 오늘 봉사자로 지정하고 같은 트랜잭션에서 `VOLUNTEER` 알림을 만든다(원본 `duty:<운영일>`). 봉사 횟수는 바꾸지 않는다.
        봉사 횟수가 1 이상인 학생만 지정할 수 있다.
      operationId: assignVolunteerDuty
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          $ref: "#/components/responses/UpdatedItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/StudentNotFound"
        "409":
          description: 봉사가 없거나(`NO_VOLUNTEER_LEFT`, `봉사가 없습니다.`) 오늘 이미 지정됐다(`ALREADY_ON_DUTY`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: NO_VOLUNTEER_LEFT
                message: 봉사가 없습니다.
    delete:
      tags: [당일 봉사자]
      summary: 당일 봉사자 지정 취소
      description: 오늘 지정을 취소하고 그 지정의 봉사 알림을 지운다. 취소 알림은 만들지 않는다. 이미 완료한 지정은 취소할 수 없다.
      operationId: cancelVolunteerDuty
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          $ref: "#/components/responses/UpdatedItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotOnDuty"
        "409":
          $ref: "#/components/responses/DutyAlreadyCompleted"
  /api/v1/volunteer/{studentId}/duty/complete:
    post:
      tags: [당일 봉사자]
      summary: 당일 봉사 완료
      description: |
        자치위원이 봉사를 확인했을 때 누른다. 지정을 완료로 바꾸고 `−1` 조정 기록과 차감을 한 트랜잭션에서 한다.
        완료는 한 번만 반영된다. 그 사이 횟수가 0이 됐으면 409 `VOLUNTEER_COUNT_ZERO`이고 완료 표시도 취소된다.
      operationId: completeVolunteerDuty
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          $ref: "#/components/responses/UpdatedItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotOnDuty"
        "409":
          description: 이미 완료했거나(`DUTY_ALREADY_COMPLETED`) 그 사이 봉사 횟수가 0이 됐다(`VOLUNTEER_COUNT_ZERO`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: DUTY_ALREADY_COMPLETED
                message: 이미 봉사를 완료했습니다.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      description: DataGSM 학생 id(명단 항목의 `studentId`)
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        재시도 방지 키(100자 이하). 웹은 클릭마다 새 UUID를 보낸다.
        같은 키로 다시 오면 반영하지 않고 현재 상태를 200으로 돌려준다. 그 키가 다른 학생이나 반대 방향에 쓰였으면 409 `IDEMPOTENCY_KEY_REUSED`다.
        보내지 않으면 요청마다 반영한다.
      schema:
        type: string
        maxLength: 100
  responses:
    UpdatedItem:
      description: 바뀐 학생의 명단 항목
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VolunteerResponse"
    Unauthenticated:
      description: 로그인하지 않았다. Spring Security가 `UNAUTHORIZED`로 응답한다. 세션은 있지만 회원이 삭제됐으면 `MEMBER_NOT_FOUND`다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: UNAUTHORIZED
            message: 로그인이 필요합니다.
    AdminOnly:
      description: 관리자가 아닌 계정이다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ADMIN_ONLY
            message: 관리자만 사용할 수 있습니다.
    InvalidRequest:
      description: "`Idempotency-Key`가 100자를 넘는다."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INVALID_REQUEST
            message: 요청 값이 올바르지 않습니다.
    StudentNotFound:
      description: 그 DataGSM 학생 id로 저장된 학생이 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: STUDENT_NOT_FOUND
            message: 학생을 찾을 수 없습니다.
    KeyReused:
      description: 재시도 키를 다른 학생이나 반대 방향 요청에 썼다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: IDEMPOTENCY_KEY_REUSED
            message: 다른 요청에 이미 쓴 재시도 키입니다.
    NotOnDuty:
      description: 학생이 없거나(`STUDENT_NOT_FOUND`) 오늘 봉사자로 지정되지 않았다(`NOT_ON_DUTY`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: NOT_ON_DUTY
            message: 오늘 봉사자로 지정되지 않은 학생입니다.
    DutyAlreadyCompleted:
      description: 이미 완료한 지정이다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: DUTY_ALREADY_COMPLETED
            message: 이미 봉사를 완료했습니다.
  schemas:
    VolunteerAdjustmentResponse:
      type: object
      required: [createdAt, delta, requestedDelta]
      properties:
        createdAt:
          type: string
          format: date-time
          description: 조정한 시각
        delta:
          type: integer
          description: 실제로 바뀐 횟수. 양수는 추가, 음수는 차감(당일 봉사 완료 포함)
          example: -2
        requestedDelta:
          type: integer
          description: 관리자가 요청한 횟수. 차감은 남은 횟수까지만 하므로 delta와 다를 수 있다
          example: -5
        reason:
          type: [string, "null"]
          description: 사유. 남기지 않았으면 null
    VolunteerAdjustRequest:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
          minimum: -99
          maximum: 99
          not:
            const: 0
          description: 바꿀 횟수. 양수는 추가, 음수는 차감(0 제외). 차감은 남은 횟수까지만 한다
          example: -3
        reason:
          type: [string, "null"]
          maxLength: 100
          description: 사유(선택). 학생 개인정보는 넣지 않는다. 앞뒤 공백을 지우고 비어 있으면 저장하지 않는다
          example: 청소 당번 대체
    VolunteerResponse:
      type: object
      required: [studentId, name, studentNumber, volunteerCount]
      properties:
        studentId:
          type: integer
          format: int64
          description: DataGSM 학생 id. 조정·지정 API의 경로 값
        name:
          type: string
        studentNumber:
          type: integer
          description: 학번
        dormitoryRoom:
          type: [integer, "null"]
          description: 호실. 미배정이면 null
        volunteerCount:
          type: integer
          minimum: 0
          description: 앞으로 해야 할 봉사 횟수
        lastActivityAt:
          type: [string, "null"]
          format: date-time
          description: 마지막 횟수 조정 시각. 조정한 적 없으면 null(화면은 `-`)
        todayDuty:
          type: [string, "null"]
          enum: [ASSIGNED, COMPLETED, null]
          description: |
            오늘 당일 봉사자 지정 상태. 웹은 null이면 "당일 봉사자 지정", ASSIGNED면 "지정됨(취소)·완료", COMPLETED면 "완료됨"을 보여준다.
      example:
        studentId: 200
        name: 학생
        studentNumber: 2105
        dormitoryRoom: 412
        volunteerCount: 2
        lastActivityAt: "2026-10-01T03:00:00Z"
        todayDuty: ASSIGNED
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 서버 `ErrorCode` 이름
        message:
          type: string
          description: 오류 코드의 기본 메시지. 예외 원문을 담지 않는다.
        errors:
          type: array
          description: 요청 값 검증 실패 때만 있다. 거부된 입력값은 담지 않는다.
          items:
            type: object
            required: [field, reason]
            properties:
              field:
                type: string
              reason:
                type: string
